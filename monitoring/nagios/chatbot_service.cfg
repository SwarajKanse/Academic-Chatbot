###############################################################################
# Nagios Service and Host Definition for Academic Chatbot Stack
###############################################################################

define host {
    use                     linux-server
    host_name               academic-chatbot-prod
    alias                   Academic Chatbot Production Node
    address                 127.0.0.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define command {
    command_name    check_academic_chatbot
    command_line    python3 /usr/local/nagios/libexec/check_chatbot_health.py -H $HOSTADDRESS$ -p $ARG1$ -m $ARG2$ -w 1.5 -c 3.0 --check-metrics
}

define service {
    use                     generic-service
    host_name               academic-chatbot-prod
    service_description     Academic Chatbot Application & Metrics Health
    check_command           check_academic_chatbot!8501!8000
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          devops-team
}

define service {
    use                     generic-service
    host_name               academic-chatbot-prod
    service_description     Prometheus Monitoring Service
    check_command           check_tcp!9090
    check_interval          2
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               academic-chatbot-prod
    service_description     Grafana Dashboard Service
    check_command           check_tcp!3000
    check_interval          2
    retry_interval          1
    max_check_attempts      3
}

define contactgroup {
    contactgroup_name       devops-team
    alias                   DevOps Engineering Group
    members                 swaraj,adit,aryan
}
