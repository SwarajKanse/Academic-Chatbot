name: Academic Chatbot CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "academic-chatbot"

jobs:
  # ============================================================================
  # 1. Code Quality & Static Analysis Gate
  # ============================================================================
  lint-and-code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Code Inspection
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app.py rag_engine.py monitoring/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and styling warnings
          flake8 app.py rag_engine.py monitoring/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  # ============================================================================
  # 2. Automated Unit & Integration Testing
  # ============================================================================
  test-suite:
    name: Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint-and-code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Execute Pytest Suite with Coverage
        env:
          GROQ_API_KEY: "gsk_mock_ci_pipeline_key_for_testing_00000"
        run: |
          pytest tests/ -v --cov=monitoring --cov-report=xml --cov-report=term

      - name: Validate Nagios Health Check Plugin Syntax
        run: |
          python monitoring/nagios/check_chatbot_health.py --help

  # ============================================================================
  # 3. Docker Container Build & Security Verification
  # ============================================================================
  docker-build-verify:
    name: Docker Build & Container Audit
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}, ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Non-Root User & Container Integrity
        run: |
          echo "Verifying container user id..."
          USER_ID=$(docker run --rm ${{ env.IMAGE_NAME }}:latest id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "FAILED: Container runs as root (UID 0)"
            exit 1
          fi
          echo "PASSED: Container runs as non-root user (UID $USER_ID)"

  # ============================================================================
  # 4. Multi-Service Stack Deployment & Health Verification
  # ============================================================================
  compose-stack-smoke-test:
    name: Docker Compose Multi-Service Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build-verify
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Launch Multi-Service Stack (Chatbot + Prometheus + Grafana)
        run: |
          docker compose up -d academic-chatbot prometheus grafana
          echo "Waiting 25 seconds for service warm-up and healthcheck..."
          sleep 25

      - name: Validate Container Health
        run: |
          docker compose ps
          # Check health of academic-chatbot
          STATUS=$(docker inspect --format='{{json .State.Health.Status}}' academic-chatbot-app || echo '"unknown"')
          echo "Academic Chatbot health status: $STATUS"

      - name: Validate Nagios Health Check
        run: |
          python3 monitoring/nagios/check_chatbot_health.py -H localhost -p 8501 -m 8000 --check-metrics

      - name: Graceful Teardown
        if: always()
        run: |
          docker compose down -v
