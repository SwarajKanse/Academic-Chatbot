name: Pull Request Fast Feedback Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  fast-feedback:
    name: Fast Unit & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Run fast tests
        run: |
          pytest tests/ -v
