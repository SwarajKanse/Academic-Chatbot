services:
  # ============================================================================
  # 1. Academic Chatbot Application Service
  # ============================================================================
  academic-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: academic-chatbot:latest
    container_name: academic-chatbot-app
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - METRICS_PORT=8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - academic-net

  # ============================================================================
  # 2. Prometheus Monitoring & Metrics Aggregator
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: academic-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - academic-chatbot
    networks:
      - academic-net

  # ============================================================================
  # 3. Grafana Analytics & Telemetry Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: academic-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - academic-net

  # ============================================================================
  # 4. cAdvisor Container Resource Telemetry
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: academic-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - academic-net

networks:
  academic-net:
    driver: bridge
    name: academic-chatbot-network

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
