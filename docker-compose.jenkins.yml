services:
  # ============================================================================
  # Jenkins Master Controller (LTS) with Docker CLI & Pipeline Agents
  # ============================================================================
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: academic-jenkins-lts
    restart: unless-stopped
    user: root
    ports:
      - "8082:8080"      # Web UI mapped to 8082 to avoid any local conflicts
      - "50000:50000"    # Inbound agent port
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--prefix=
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - academic-net

networks:
  academic-net:
    external: true
    name: academic-chatbot-network

volumes:
  jenkins-data:
    driver: local
